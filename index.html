/* ================= 背景去除 (magenta key) ================= */
function processSprite(url){
  return new Promise(res=>{
    const im=new Image(); im.crossOrigin='anonymous';
    im.onload=()=>{
      try{
        const cv=document.createElement('canvas'); cv.width=im.naturalWidth; cv.height=im.naturalHeight;
        const cx=cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(im,0,0);
        const d=cx.getImageData(0,0,cv.width,cv.height), p=d.data;
        const k=[p[0],p[1],p[2]];
        for(let i=0;i<p.length;i+=4){
          const dr=p[i]-k[0],dg=p[i+1]-k[1],db=p[i+2]-k[2];
          const dist=Math.sqrt(dr*dr+dg*dg+db*db);
          if(dist<70)p[i+3]=0; else if(dist<135)p[i+3]=Math.round(p[i+3]*(dist-70)/65);
        }
        cx.putImageData(d,0,0); res(cv.toDataURL('image/png'));
      }catch(e){res(url);}
    };
    im.onerror=()=>res(url);
    im.src=url;
  });
}
function loadImg(url){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=url;});}

/* ================= 音樂引擎 (WebAudio 配樂) ================= */
function T(o){
  const ev=[...(o.extra||[])];
  (o.bars||[]).forEach((bar,bi)=>{
    const t0=bi*o.barBeats;
    if(bar.b!=null){
      if(o.pump){for(let k=0;k<o.barBeats*2;k++)ev.push({t:t0+k*0.5,n:bar.b,d:0.22,v:0.26,w:'square'});}
      else{ev.push({t:t0,n:bar.b,d:o.barBeats*0.42,v:0.4,w:'triangle'});ev.push({t:t0+o.barBeats/2,n:bar.b+7,d:o.barBeats*0.25,v:0.26,w:'triangle'});}
    }
    if(o.pad&&bar.p)bar.p.forEach(m=>ev.push({t:t0,n:m,d:o.barBeats*0.98,v:o.padV||0.09,w:'sine',atk:0.5}));
  });
  (o.mel||[]).forEach(e=>ev.push({t:e[0],n:e[1],d:e[2],v:e[3]!=null?e[3]:0.35,w:e[4]||'triangle'}));
  ev.sort((a,b)=>a.t-b.t);
  return {bpm:o.bpm,loop:o.loop,events:ev,send:o.send||0.12};
}
const TRACKS={
  daily:T({bpm:96,barBeats:4,loop:16,pad:true,padV:0.08,

const Music={ctx:null,master:null,delay:null,timer:null,st:0,nextT:0,def:null,bus:null,send:null,muted:false,
  init(){if(this.ctx)return;const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
    this.master=this.ctx.createGain();this.master.gain.value=0.9;
    const lp=this.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
    this.master.connect(lp);lp.connect(this.ctx.destination);
    this.delay=this.ctx.createDelay(1);this.delay.delayTime.value=0.28;
    const fb=this.ctx.createGain();fb.gain.value=0.3;this.delay.connect(fb);fb.connect(this.delay);
    const wet=this.ctx.createGain();wet.gain.value=0.5;this.delay.connect(wet);wet.connect(this.master);},
  play(name){this.init();const def=TRACKS[name];if(!def)return;this.stop();this.def=def;

const $=id=>document.getElementById(id);
const stage=$('stage'),world=$('world'),sprLayer=$('sprLayer');
let bgFlip=false,curBg='';
const VN={i:-1,flags:{},auto:false,skip:false,typing:false,wait:false,waitCh:false,lock:false,typeTimer:null,pendTimer:null,log:[]};

function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();

function setBg(name){if(!name||name===curBg)return;curBg=name;bgFlip=!bgFlip;
  const show=bgFlip?$('bgA'):$('bgB'),hide=bgFlip?$('bgB'):$('bgA');
  show.src=IMG[name];show.classList.add('on');hide.classList.remove('on');}
function setFilter(f){world.className=f?('flt-'+f):'';}
function setSprites(list){
  const keep={};
  list.forEach(([id,pos])=>{keep[id]=true;
    let el=sprLayer.querySelector('[data-id="'+id+'"]');
    if(el){if(!el.classList.contains('pos-'+pos)){el.className='sprWrap pos-'+pos;}}
    else{
      el=document.createElement('div');el.className='sprWrap pos-'+pos;el.dataset.id=id;
      const im=document.createElement('img');im.src=window.SPRDONE[id]||SPR[id];el.appendChild(im);
      sprLayer.appendChild(el);
    }});
  sprLayer.querySelectorAll('.sprWrap').forEach(el=>{
    if(!keep[el.dataset.id]){el.classList.add('out');setTimeout(()=>el.remove(),380);}
  });
}
function clearSprites(){sprLayer.innerHTML='';}
function shake(){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');SFX.impact();}
function flash(){const f=$('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),60);}
function showChapter(t,s){$('chTitle').textContent=t;$('chSub').textContent=s;$('chapterCard').classList.add('on');SFX.chime();VN.waitCh=true;}
function hideChapter(){$('chapterCard').classList.remove('on');VN.waitCh=false;}

function showText(s){
  $('dialogBox').classList.add('on');
  const np=$('namePlate'),tb=$('textBox');
  if(s.sp){const c=SPCOLOR[s.sp]||['#999','#666'];np.style.display='block';np.textContent=s.sp;
    np.style.background='linear-gradient(135deg,'+c[0]+','+c[1]+')';}
  else np.style.display='none';
  tb.className=s.think?'think':'';tb.textContent='';
  $('advArrow').classList.remove('on');
  VN.typing=true;VN.wait=true;
  const full=s.t;let idx=0;clearInterval(VN.typeTimer);
  const spd=VN.skip?4:26;
  VN.typeTimer=setInterval(()=>{
    idx++;tb.textContent=full.slice(0,idx);
    if(idx%3===0&&s.sp)SFX.blip(s.sp);
    if(idx>=full.length)finishType(full);
  },spd);
  VN.log.push({sp:s.sp||'',t:full,think:s.think});
  renderLog();
}
function finishType(full){clearInterval(VN.typeTimer);$('textBox').textContent=full;VN.typing=false;$('advArrow').classList.add('on');
  if(VN.auto&&!VN.skip)VN.pendTimer=setTimeout(()=>advance(),1600);
  if(VN.skip)VN.pendTimer=setTimeout(()=>advance(),140);}

function showChoices(list){
  VN.wait=false;VN.lock=true;
  $('advArrow').classList.remove('on');
  const box=$('choiceBox');box.innerHTML='';
  list.forEach((c,i)=>{
    const b=document.createElement('button');b.className='chBtn';b.textContent=c.t;b.style.animationDelay=(i*0.12)+'s';
    b.onclick=e=>{e.stopPropagation();SFX.ui();Object.assign(VN.flags,c.f||{});box.innerHTML='';VN.lock=false;next();};
    box.appendChild(b);
  });
  VN.skip=false;$('btnSkip').classList.remove('act');
}

function step(s){
  clearTimeout(VN.pendTimer);
  if(s.only&&!s.only(VN.flags))return next();
  if(s.ch){showChapter(s.ch,s.sub);return;}
  if(s.bg)setBg(s.bg);
  if(s.filter!==undefined)setFilter(s.filter);
  if(s.sprites)setSprites(s.sprites);
  if(s.music)Music.play(s.music);
  if(s.fx==='shake')shake();
  if(s.fx==='flash')flash();
  if(s.fx==='fadeWhite'){$('whiteFade').classList.add('on');}
  if(s.end){setTimeout(()=>{$('endScreen').classList.add('on');localStorage.removeItem('lunchVN');},1400);return;}
  if(s.choice)return showChoices(s.choice);
  if(s.t)return showText(s);
  VN.pendTimer=setTimeout(()=>next(),VN.skip?60:420);
}
function next(){VN.i++;save();step(SCRIPT[VN.i]);}
function go(i){VN.i=i;step(SCRIPT[i]);}
function save(){try{localStorage.setItem('lunchVN',JSON.stringify({i:VN.i,flags:VN.flags}));}catch(e){}}

function advance(){
  if(VN.lock)return;
  clearTimeout(VN.pendTimer);
  if(VN.waitCh){hideChapter();return next();}
  if(VN.typing){clearInterval(VN.typeTimer);finishType(VN.log[VN.log.length-1].t);return;}
  if(VN.wait){VN.wait=false;return next();}
}
stage.addEventListener('click',()=>advance());
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();advance();}});

/* ------- 紀錄 ------- */
function renderLog(){const L=$('logList');L.innerHTML=VN.log.map(e=>{
  const sp=e.sp?'<span class="logSp" style="background:'+(SPCOLOR[e.sp]?('linear-gradient(135deg,'+SPCOLOR[e.sp][0]+','+SPCOLOR[e.sp][1]+')'):'#666')+'">'+e.sp+'</span>':'';
  return '<div class="logItem">'+sp+(e.think?'<i>'+e.t+'</i>':e.t)+'</div>';}).join('');
  L.scrollTop=L.scrollHeight;}
$('btnLog').onclick=e=>{e.stopPropagation();$('logPanel').classList.add('on');};
$('logClose').onclick=e=>{e.stopPropagation();$('logPanel').classList.remove('on');};
$('logPanel').onclick=e=>e.stopPropagation();

/* ------- 控制 ------- */
$('btnAuto').onclick=e=>{e.stopPropagation();VN.auto=!VN.auto;$('btnAuto').classList.toggle('act',VN.auto);SFX.ui();};
$('btnSkip').onclick=e=>{e.stopPropagation();VN.skip=!VN.skip;$('btnSkip').classList.toggle('act',VN.skip);SFX.ui();if(VN.skip&&!VN.wait&&!VN.waitCh&&!VN.lock)advance();};
$('btnMus').onclick=e=>{e.stopPropagation();if(!Music.ctx)return;Music.muted=!Music.muted;Music.master.gain.value=Music.muted?0:0.9;$('btnMus').classList.toggle('act',!Music.muted);};
$('btnTitle').onclick=e=>{e.stopPropagation();SFX.ui();toTitle();};
function toTitle(){clearTimeout(VN.pendTimer);clearInterval(VN.typeTimer);VN.typing=false;VN.wait=false;VN.lock=false;
  $('endScreen').classList.remove('on');$('whiteFade').classList.remove('on');$('dialogBox').classList.remove('on');
  $('choiceBox').innerHTML='';hideChapter();clearSprites();setFilter('');curBg='';
  $('titleScreen').style.display='flex';if(Music.ctx)Music.play('daily');checkCont();}

/* ------- 標題 / 開始 ------- */
function checkCont(){try{const d=JSON.parse(localStorage.getItem('lunchVN'));$('btnCont').style.display=(d&&d.i>0&&d.i<SCRIPT.length-1)?'block':'none';}catch(e){$('btnCont').style.display='none';}}
function startGame(fromSave){
  $('titleScreen').style.display='none';
  Music.init();if(Music.ctx&&Music.ctx.state==='suspended')Music.ctx.resume();
  $('btnMus').classList.add('act');
  clearSprites();curBg='';VN.flags={};VN.log=[];renderLog();
  if(fromSave){try{const d=JSON.parse(localStorage.getItem('lunchVN'));VN.flags=d.flags||{};go(d.i);}catch(e){go(0);}}
  else go(0);
}
$('btnStart').onclick=e=>{e.stopPropagation();SFX.ui();startGame(false);};
$('btnCont').onclick=e=>{e.stopPropagation();SFX.ui();startGame(true);};
$('btnReplay').onclick=e=>{e.stopPropagation();SFX.ui();$('endScreen').classList.remove('on');$('whiteFade').classList.remove('on');$('dialogBox').classList.remove('on');clearSprites();curBg='';VN.flags={};VN.log=[];renderLog();go(0);};
$('btnEndTitle').onclick=e=>{e.stopPropagation();SFX.ui();toTitle();};

/* ------- 載入 ------- */
window.SPRDONE={};
(async function(){
  const tasks=[];let done=0;const total=Object.keys(IMG).length+Object.keys(SPR).length;
  const tick=()=>{done++;$('loadBar').style.width=Math.round(done/total*100)+'%';};
  for(const k in IMG)tasks.push(loadImg(IMG[k]).then(tick));
  for(const k in SPR)tasks.push(processSprite(SPR[k]).then(u=>{SPRDONE[k]=u;tick();}));
  await Promise.all(tasks);
  $('titleBg').src=IMG.title;
  setTimeout(()=>{$('loadScreen').style.opacity='0';setTimeout(()=>{$('loadScreen').style.display='none';},650);checkCont();},400);
})();
</script>
</body>
</html>
